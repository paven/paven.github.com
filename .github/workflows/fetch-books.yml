name: Fetch books

on:
  push:
  schedule:
    - cron: '0 6 * * *'

jobs:
  fetch-books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch books
        run: |
          python3 - <<'EOF'
          import urllib.request
          import os
          from xml.etree import ElementTree as ET

          BASE = 'https://ramblingreaders.org/user/acyclic/books'

          from email.utils import parsedate_to_datetime

          def fetch_shelf(shelf, limit=10):
              url = f'{BASE}/{shelf}/rss'
              req = urllib.request.Request(url, headers={'User-Agent': 'mumma.nu/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      root = ET.fromstring(r.read().decode('utf-8', errors='ignore'))
              except Exception as e:
                  print(f'Failed to fetch {shelf}: {e}')
                  return []
              items = []
              for item in root.findall('./channel/item')[:limit]:
                  raw_title = item.findtext('title', '')
                  title = raw_title.split(': ', 1)[-1] if ': ' in raw_title else raw_title
                  link = item.findtext('link', '')
                  pub = item.findtext('pubDate', '')
                  try:
                      dt = parsedate_to_datetime(pub)
                  except Exception:
                      dt = None
                  items.append({'title': title, 'url': link, 'status': shelf, 'dt': dt})
              items.sort(key=lambda x: x['dt'] or __import__('datetime').datetime.min.replace(tzinfo=__import__('datetime').timezone.utc), reverse=True)
              return items

          reading = fetch_shelf('reading', 10)
          read = fetch_shelf('read', 10)

          # Priority: currently reading first, then recently finished
          books = reading + [b for b in read if b['url'] not in {r['url'] for r in reading}]
          books = books[:3]

          os.makedirs('_data', exist_ok=True)
          with open('_data/books.yml', 'w') as f:
              for b in books:
                  title = b['title'].replace("'", "''")
                  f.write(f"- title: '{title}'\n  url: '{b['url']}'\n  status: '{b['status']}'\n")

          print(f'Wrote {len(books)} books ({len(reading)} reading, {len(read)} read)')
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/books.yml
          git diff --cached --quiet || (git commit -m "Update books" && git push)
